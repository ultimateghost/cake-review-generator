<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake o'clock — Review Reply Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDF8F0; font-family: sans-serif; padding: 24px 16px; max-width: 600px; margin: 0 auto; }
  h1 { font-family: Georgia, serif; font-size: 22px; color: #3D2B1F; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 11px; color: #B89880; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 24px; }
  .card { background: #FFFCF7; border: 1px solid rgba(201,168,76,0.25); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
  .label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: #B89880; margin-bottom: 10px; }
  .stars { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .star-btn { padding: 8px 14px; border-radius: 20px; border: 1.5px solid rgba(201,168,76,0.25); background: transparent; color: #7A5C46; font-size: 13px; cursor: pointer; }
  .star-btn.active { background: #C9A84C; border-color: #C9A84C; color: white; }
  input, select, textarea { width: 100%; border: 1.5px solid rgba(201,168,76,0.25); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: #3D2B1F; background: #FDF8F0; outline: none; margin-top: 4px; font-family: sans-serif; }
  textarea { min-height: 120px; resize: vertical; }
  .row { display: flex; gap: 12px; margin-bottom: 12px; }
  .row > div { flex: 1; }
  .btn { width: 100%; margin-top: 12px; padding: 15px; background: #3D2B1F; color: #FDF8F0; border: none; border-radius: 10px; font-size: 15px; font-family: Georgia, serif; font-style: italic; cursor: pointer; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .result { background: #FFFCF7; border: 1.5px solid #E8D5A3; border-radius: 14px; padding: 20px; margin-bottom: 14px; display: none; }
  .result-text { font-size: 14px; line-height: 1.75; color: #3D2B1F; white-space: pre-wrap; margin-bottom: 16px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-copy { flex: 1; padding: 12px; background: #C9A84C; color: white; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; }
  .btn-copy.copied { background: #6B9E78; }
  .btn-regen { padding: 12px 16px; background: transparent; border: 1.5px solid rgba(201,168,76,0.25); border-radius: 10px; font-size: 13px; color: #7A5C46; cursor: pointer; }
  .error { color: #C0392B; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div style="text-align:center;margin-bottom:24px;padding-top:8px;">
  <div style="font-size:36px;margin-bottom:8px;">🎂</div>
  <h1>Cake o'clock</h1>
  <p class="sub">Google Review Reply Generator</p>
</div>
<div class="card">
  <div class="label">Star Rating</div>
  <div class="stars">
    <button class="star-btn" onclick="selectStars(5)">⭐⭐⭐⭐⭐ 5</button>
    <button class="star-btn" onclick="selectStars(4)">⭐⭐⭐⭐ 4</button>
    <button class="star-btn" onclick="selectStars(3)">⭐⭐⭐ 3</button>
    <button class="star-btn" onclick="selectStars(2)">⭐⭐ 2</button>
    <button class="star-btn" onclick="selectStars(1)">⭐ 1</button>
  </div>
  <div class="row">
    <div>
      <div class="label">Reviewer Name (Optional)</div>
      <input type="text" id="nameInput" placeholder="e.g. Sarah">
    </div>
    <div>
      <div class="label">Reply Tone</div>
      <select id="toneInput">
        <option>Warm & Friendly</option>
        <option>Professional</option>
        <option>Apologetic</option>
        <option>Enthusiastic</option>
      </select>
    </div>
  </div>
  <div class="label">Customer Review</div>
  <textarea id="reviewInput" placeholder="Paste the customer's review here..."></textarea>
  <div class="error" id="error"></div>
  <button class="btn" id="generateBtn" onclick="generateReply()">✦ Generate Reply</button>
</div>
<div class="result" id="result">
  <div class="label" style="color:#C9A84C;">✦ Your Reply</div>
  <div class="result-text" id="resultText"></div>
  <div class="btn-row">
    <button class="btn-copy" id="copyBtn" onclick="copyReply()">Copy to Clipboard</button>
    <button class="btn-regen" onclick="generateReply()">↺ Try Again</button>
  </div>
</div>
<script>
  let selectedStars = null;
  function selectStars(s) {
    selectedStars = s;
    document.querySelectorAll('.star-btn').forEach((btn, i) => {
      btn.classList.toggle('active', [5,4,3,2,1][i] === s);
    });
  }
  async function generateReply() {
    const review = document.getElementById('reviewInput').value.trim();
    const name = document.getElementById('nameInput').value.trim();
    const tone = document.getElementById('toneInput').value;
    const errorEl = document.getElementById('error');
    if (!review) { errorEl.textContent = 'Please paste a review first.'; return; }
    if (!selectedStars) { errorEl.textContent = 'Please select a star rating.'; return; }
    errorEl.textContent = '';
    document.getElementById('result').style.display = 'none';
    const btn = document.getElementById('generateBtn');
    btn.disabled = true;
    btn.textContent = 'Crafting your reply...';
    try {
      const res = await fetch('/api/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ review, stars: selectedStars, name, tone })
      });
      const data = await res.json();
      if (data.reply) {
        document.getElementById('resultText').textContent = data.reply;
        document.getElementById('result').style.display = 'block';
      } else {
        errorEl.textContent = 'Something went wrong. Please try again.';
      }
    } catch {
      errorEl.textContent = 'Connection error. Please try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = '✦ Generate Reply';
    }
  }
  async function copyReply() {
    await navigator.clipboard.writeText(document.getElementById('resultText').textContent);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy to Clipboard'; btn.classList.remove('copied'); }, 2000);
  }
</script>
</body>
</html>
